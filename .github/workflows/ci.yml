name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint / type-check / unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
      - run: pnpm schema:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  target-app:
    name: Target app (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fixtures/target-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Flutter module (analyze + test)
        working-directory: fixtures/target-app/flutter_module
        run: flutter pub get && flutter analyze && flutter test
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;28.2.13676358"
      - run: ./gradlew testDebugUnitTest lintRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-target-app
          path: fixtures/target-app/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

  build:
    name: Build ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, arch: x64 }
          - { name: macos-arm64, os: macos-14, arch: arm64 }
          - { name: macos-x64, os: macos-13, arch: x64 }
          - { name: linux-x64, os: ubuntu-latest, arch: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
      - name: Python unit tests (per-OS)
        run: uv run pytest
      - name: Build Python packages
        run: pnpm build:py
      - name: PyInstaller onedir (Runtime)
        run: |
          uv sync --locked --group package
          uv run --group package pyinstaller runtime/packaging/pulse-runtime.spec --distpath dist/runtime --workpath build/pyinstaller --noconfirm
      - name: Runtime package smoke test (start + /health + WS + token)
        shell: bash
        run: |
          exe=dist/runtime/pulse-runtime/pulse-runtime
          [ "$RUNNER_OS" = "Windows" ] && exe="$exe.exe"
          "$exe" --version
          uv run python runtime/packaging/smoke.py "$exe"
      # Unsigned package. Installers/signing arrive in P2.12.
      - name: Package desktop
        run: pnpm --filter @pulse/desktop exec electron-forge package --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-${{ matrix.name }}
          path: |
            apps/desktop/out/
            dist/python/
            dist/runtime/
          retention-days: 7
