[project]
name = "pulse-schema"
version = "0.0.0"
description = "Pulse offline case contract candidate (Pydantic source of truth)"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3", "jsonschema>=4.25,<5"]

[project.scripts]
pulse-schema = "pulse_schema.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pulse_schema"]
