[project]
name = "pulse-runtime"
version = "0.0.0"
description = "Pulse Runtime: execution engine shared by local machines and public nodes (incl. node agent)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pulse-observability",
    "pulse-schema",
    "fastapi>=0.115",
    "numpy>=2.0,<3",
    "opencv-python-headless>=4.10,<5",
    "uvicorn>=0.32",
    "websockets>=13",
]

[project.scripts]
pulse-runtime = "pulse_runtime.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pulse_runtime"]
