<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>靶场 WebView</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 16px;
      }
      input,
      button {
        font-size: 18px;
        margin: 8px 0;
        padding: 8px;
        width: 100%;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <h1 id="web-title">WebView 订单查询</h1>
    <label for="order-no">订单号</label>
    <input id="order-no" type="text" placeholder="请输入订单号" />
    <button id="btn-query" type="button">查询</button>
    <p id="query-result" aria-live="polite">尚未查询</p>
    <script>
      var wrong = new URLSearchParams(location.search).get('wrong') === '1';
      document.getElementById('btn-query').addEventListener('click', function () {
        var no = document.getElementById('order-no').value.trim();
        var shown = wrong ? no + '0' : no;
        document.getElementById('query-result').textContent = no
          ? '订单 ' + shown + ' 状态：已完成'
          : '请输入订单号';
      });
    </script>
  </body>
</html>
